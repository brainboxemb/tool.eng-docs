name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  publish-conformance-docs:
    needs: test
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Capture owner test evidence
        run: |
          mkdir -p bld/docs/evidence
          python -m pytest -q | tee bld/docs/evidence/pytest.txt

      - name: Generate conformance diagrams
        run: |
          mkdir -p bld/docs/diagrams bld/docs/fixtures
          eng-docs diagrams --source tests/fixtures --out bld/docs/diagrams
          cp tests/fixtures/*.yaml bld/docs/fixtures/

      - name: Generate document-assembly conformance example
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          example_root="$(mktemp -d)"
          cp -a examples/assembly/. "$example_root/"

          eng-docs manifest \
            --source "$example_root/produced" \
            --out "$example_root/produced/assets.yml" \
            --producer tool.eng-docs.example-diagrams \
            --producer-version 0.2.0.dev0 \
            --source-revision "$SOURCE_SHA" \
            --lifecycle docs \
            --relationship producer-source \
            --include '*.svg'

          eng-docs assemble \
            --root "$example_root" \
            --config assembly.yml \
            --out bld/docs/assembly

          mkdir -p bld/docs/assembly/_input
          cp examples/assembly/assembly.yml bld/docs/assembly/_input/assembly.yml
          cp examples/assembly/docs/overview.md bld/docs/assembly/_input/overview.md
          cp "$example_root/produced/assets.yml" bld/docs/assembly/_input/assets.yml

      - name: Build generated documentation index
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cat > bld/docs/README.md <<EOF
          # tool.eng-docs generated conformance documentation

          Generated from source commit \`${SOURCE_SHA}\`.

          This branch is review evidence for both reusable capabilities: declarative diagram generation and document assembly around already-produced assets. The generated files are intentionally inspectable without opening an Actions log.

          ## Owner test evidence

          - [pytest output](evidence/pytest.txt)
          - [source revision](source-sha.txt)

          ## Document assembly example

          The example keeps ordinary source Markdown readable, inventories an already-produced SVG through a manifest, and assembles a self-contained publication copy.

          - [assembled document index](assembly/documents/README.md)
          - [assembled document](assembly/documents/overview.md)
          - [localized asset](assembly/assets/architecture/system.svg)
          - [assembly configuration](assembly/_input/assembly.yml)
          - [source Markdown before assembly](assembly/_input/overview.md)
          - [producer asset manifest](assembly/_input/assets.yml)

          ## Diagram conformance

          The SVG output is the quickest visual review; the draw.io files verify that the same diagrams remain natively editable.

          ### Simple flow

          [Source YAML](fixtures/simple-flow.yaml) · [Editable draw.io](diagrams/simple-flow.drawio)

          ![Simple flow](diagrams/simple-flow.svg)

          ### Layered architecture

          [Source YAML](fixtures/layered-architecture.yaml) · [Editable draw.io](diagrams/layered-architecture.drawio)

          ![Layered architecture](diagrams/layered-architecture.svg)

          ### Routing stress

          [Source YAML](fixtures/routing-stress.yaml) · [Editable draw.io](diagrams/routing-stress.drawio)

          ![Routing stress](diagrams/routing-stress.svg)
          EOF
          printf '%s\n' "$SOURCE_SHA" > bld/docs/source-sha.txt

      - name: Validate generated documentation
        run: |
          test -f bld/docs/README.md
          test -f bld/docs/source-sha.txt
          test -s bld/docs/evidence/pytest.txt
          test -f bld/docs/assembly/documents/README.md
          test -f bld/docs/assembly/documents/overview.md
          test -f bld/docs/assembly/assets/architecture/system.svg
          test -f bld/docs/assembly/_input/assembly.yml
          test -f bld/docs/assembly/_input/overview.md
          test -f bld/docs/assembly/_input/assets.yml
          grep -Fq '../assets/architecture/system.svg' bld/docs/assembly/documents/overview.md
          grep -Fq '../../../raw/prod/docs/assets/architecture/system.svg' bld/docs/assembly/_input/overview.md
          test -f bld/docs/diagrams/simple-flow.svg
          test -f bld/docs/diagrams/simple-flow.drawio
          test -f bld/docs/diagrams/layered-architecture.svg
          test -f bld/docs/diagrams/layered-architecture.drawio
          test -f bld/docs/diagrams/routing-stress.svg
          test -f bld/docs/diagrams/routing-stress.drawio

      - name: Upload generated documentation
        uses: actions/upload-artifact@v4
        with:
          name: eng-docs-conformance
          path: bld/docs
          retention-days: 14

      - name: Publish generated documentation branch
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "ERROR: missing or invalid pull-request number" >&2
              exit 1
            fi
            TARGET_BRANCH="dev/pr-${PR_NUMBER}/docs"
          else
            TARGET_BRANCH="prod/docs"
          fi

          publish_dir="$(mktemp -d)"
          cp -a bld/docs/. "$publish_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global credential.helper store
          printf "https://x-access-token:%s@github.com\n" "$GITHUB_TOKEN" > ~/.git-credentials

          git switch --orphan generated-docs
          git clean -fdx
          cp -a "$publish_dir/." ./

          git add .
          git commit -m "Publish generated documentation for ${SOURCE_SHA}"
          git push --force origin "HEAD:${TARGET_BRANCH}"

          echo "Published generated documentation to ${TARGET_BRANCH}"
