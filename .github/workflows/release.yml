name: Release

on:
  push:
    branches:
      - 'release-request/**'
  workflow_dispatch:
    inputs:
      version:
        description: Optional release tag (vX.Y.Z); normally inferred from VERSION
        required: false
        type: string
      release_sha:
        description: Exact main commit to release
        required: false
        type: string
      dry_run:
        description: Validate the release contract without side effects
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # tool.git-project owns the generic release transaction: the requested commit
  # must be current main, Test must already be green on that exact commit, and the
  # immutable tag is created only after those checks. The tag is then verified by
  # this repository's own Test workflow before package publication continues.
  release-lifecycle:
    permissions:
      contents: write
      actions: write
    uses: brainboxemb/tool.git-project/.github/workflows/reusable-release.yml@v0.2.2
    with:
      version: ${{ inputs.version || '' }}
      release_sha: ${{ inputs.release_sha || '' }}
      version_file: VERSION
      changelog_file: CHANGELOG.md
      required_main_workflows: test.yml
      tagged_verification_workflow: test.yml
      wait_for_tagged_verification: true
      create_github_release: false
      dry_run: ${{ inputs.dry_run || false }}

  # Python package construction remains domain-owned. It consumes the immutable
  # tag created above and attaches wheel/sdist assets to the GitHub Release.
  package-release:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    needs: release-lifecycle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout verified release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-lifecycle.outputs.version }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify package version contract
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-lifecycle.outputs.version }}
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          test "$(tr -d '\r\n' < VERSION)" = "$expected"
          python - <<'PY'
          from pathlib import Path
          import tomllib
          import sys
          expected = Path('VERSION').read_text(encoding='utf-8').strip()
          package = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          if package != expected:
              raise SystemExit('pyproject.toml version does not match VERSION')
          sys.path.insert(0, 'src')
          import eng_docs
          if eng_docs.__version__ != expected:
              raise SystemExit('runtime __version__ does not match VERSION')
          PY

      - name: Build Python package assets
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build

      - name: Create GitHub Release with package assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-lifecycle.outputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          awk -v version="$version" '
            $0 ~ "^## " version "([[:space:]]|$)" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "tool.eng-docs ${RELEASE_TAG}" \
            --notes-file release-notes.md
