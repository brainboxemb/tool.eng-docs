name: Release

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'src/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          print(data['project']['version'])
          PY
          )"
          if [[ "$VERSION" == *dev* ]]; then
            echo "Development version $VERSION is not releasable"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: tag
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1 || \
             git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.version.outputs.skip != 'true' && steps.tag.outputs.exists != 'true'
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true' && steps.tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "tool.eng-docs ${{ steps.version.outputs.tag }}" \
            --notes "Reusable declarative engineering-diagram tooling release ${{ steps.version.outputs.tag }}. See CHANGELOG.md for scope and changes."
