diagram:
  id: sequence-flow
  type: sequence
  title: Asynchronous work sequence
  width: 900
  height: 520
  description: Domain-neutral example of asynchronous hand-off followed by synchronous processing and persistence.
  note: Synchronous calls infer UML activation bars; the self-call shows internal processing.

participants:
  - id: client
    label: Client
    kind: external
  - id: worker
    label: Worker
    kind: service
  - id: store
    label: Store
    kind: storage

messages:
  - from: client
    to: worker
    label: submit work
    kind: async
  - from: worker
    to: worker
    label: process queued work using current state
    kind: call
  - from: worker
    to: store
    label: persist validated immutable work item to durable store
    kind: call
  - from: store
    to: worker
    label: stored
    kind: return
  - from: worker
    to: client
    label: result ready
    kind: async
