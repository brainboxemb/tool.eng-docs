schema_version: 1
diagram_object_type: design
object_types:
  - goal
  - requirement
  - design
  - verification
relations:
  derived_from:
    from: [requirement]
    to: [goal, requirement]
  satisfies:
    from: [design]
    to: [requirement]
  verifies:
    from: [verification]
    to: [requirement]
