diagram:
  id: structured-layer
  title: Structured layer example
  width: 900
  height: 540
  note: Node items can form a small tree; high-level edges may end on a group boundary.

groups:
  - id: interface-layer
    label: Interface layer
    kind: group-primary
    layout: {x: 70, y: 80, w: 760, h: 160}
  - id: application-layer
    label: Application package
    kind: group-secondary
    notation: packaging-component
    layout: {x: 70, y: 290, w: 760, h: 170}

nodes:
  - id: entrypoints
    group: interface-layer
    label: Entry points
    notation: component
    items:
      - Browser
      - label: Terminals
        items:
          - Local
          - Remote
    kind: component
    layout: {x: 150, y: 120, w: 260, h: 100}

  - id: service
    group: application-layer
    label: Application service
    items:
      - Worker
      - Repository
    notation: packaging-component
    kind: service
    layout: {x: 455, y: 325, w: 300, h: 100}

  - id: state
    group: application-layer
    label: Session
    notation: class
    items:
      - sessionId
      - state
    kind: component
    layout: {x: 150, y: 325, w: 220, h: 105}

edges:
  - from: entrypoints
    to: application-layer
    from_anchor: {side: bottom, position: 0.50}
    to_anchor: {side: top, position: 0.32}
