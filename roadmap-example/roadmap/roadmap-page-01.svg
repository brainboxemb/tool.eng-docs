<text x="308.96" y="303.75" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">Generate SVG and PDF from the compact view and</text>
<text x="308.96" y="314.38" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">inspect both outputs.</text>
