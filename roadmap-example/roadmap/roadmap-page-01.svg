<text x="317.30" y="258.88" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">Renderer layout adapts to wrapped content</text>
<text x="317.30" y="269.50" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">instead of imposing a fixed line-count</text>
<text x="317.30" y="280.12" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">contract on the consumer source.</text>
