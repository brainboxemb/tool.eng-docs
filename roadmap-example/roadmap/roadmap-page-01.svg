<text x="298.96" y="129.50" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11.50" font-weight="bold" fill="#2f3337">Integrate a real consumer without</text>
<text x="298.96" y="143.88" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11.50" font-weight="bold" fill="#2f3337">constraining its authoritative</text>
<text x="298.96" y="158.25" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11.50" font-weight="bold" fill="#2f3337">planning prose</text>
