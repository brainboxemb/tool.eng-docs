<text x="308.96" y="209.00" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">The consumer maps its planning model into compact</text>
<text x="308.96" y="219.62" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">RoadmapView data while keeping the original</text>
<text x="308.96" y="230.25" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">planning text complete and readable.</text>
<circle cx="301.96" cy="239.47" r="1.55" fill="#6a8bb0"/>
<text x="308.96" y="243.88" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">Renderer layout adapts to wrapped content instead</text>
<text x="308.96" y="254.50" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">of imposing a fixed line-count contract on the</text>
<text x="308.96" y="265.12" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">consumer source.</text>
