<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 841.89 595.28">
<rect width="100%" height="100%" fill="#eee"/>
<g transform="translate(0.00,0)"><rect width="100%" height="100%" fill="white"/>
<text x="30.00" y="47.00" font-family="Arial,Helvetica,sans-serif" font-size="17.00" font-weight="bold" fill="#2f3337">Engineering roadmap</text>
<text x="30.00" y="73.25" font-family="Arial,Helvetica,sans-serif" font-size="9.00" font-weight="normal" fill="#666666">Domain-neutral RoadmapView example</text>
<rect x="30.00" y="87.50" width="251.30" height="205.25" rx="7" fill="#fff" stroke="#5a8750"/>
<text x="42.00" y="111.50" font-family="Arial,Helvetica,sans-serif" font-size="12.00" font-weight="bold" fill="#2f3337">Establish the public boundary</text>
<rect x="42.00" y="130.50" width="38.00" height="16" rx="8" fill="#eaf5e7" stroke="#5a8750"/>
<text x="49.00" y="142.00" font-family="Arial,Helvetica,sans-serif" font-size="7.50" font-weight="bold" fill="#31582b">DONE</text>
<text x="42.00" y="160.00" font-family="Arial,Helvetica,sans-serif" font-size="7.50" font-weight="normal" fill="#666">~2d</text>
<text x="42.00" y="169.38" font-family="Arial,Helvetica,sans-serif" font-size="7.50" font-weight="normal" fill="#666">completed</text>
<text x="42.00" y="188.25" font-family="Arial,Helvetica,sans-serif" font-size="8.00" font-weight="bold" fill="#4b5b6b">RESULT</text>
<circle cx="45.00" cy="196.35" r="1.6" fill="#4b78a8"/>
<text x="52.00" y="200.75" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">A reusable boundary is documented and</text>
<text x="52.00" y="211.38" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">testable.</text>
<circle cx="45.00" cy="220.60" r="1.6" fill="#4b78a8"/>
<text x="52.00" y="225.00" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">Consumers retain ownership of project meaning.</text>
<text x="42.00" y="247.12" font-family="Arial,Helvetica,sans-serif" font-size="8.00" font-weight="bold" fill="#4b5b6b">DEMO</text>
<circle cx="45.00" cy="255.22" r="1.6" fill="#4b78a8"/>
<text x="52.00" y="259.62" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">Render the same view locally and in CI.</text>
<rect x="42.00" y="271.75" width="28.50" height="16" rx="5" fill="#eaf5e7" stroke="#5a8750"/>
<text x="48.00" y="283.25" font-family="Arial,Helvetica,sans-serif" font-size="7.50" font-weight="bold" fill="#31582b">SPEC</text>
<rect x="295.30" y="87.50" width="251.30" height="277.75" rx="7" fill="#fff" stroke="#4b78a8"/>
<text x="307.30" y="111.50" font-family="Arial,Helvetica,sans-serif" font-size="12.00" font-weight="bold" fill="#2f3337">Integrate a real consumer</text>
<text x="307.30" y="126.50" font-family="Arial,Helvetica,sans-serif" font-size="12.00" font-weight="bold" fill="#2f3337">without constraining its</text>
<text x="307.30" y="141.50" font-family="Arial,Helvetica,sans-serif" font-size="12.00" font-weight="bold" fill="#2f3337">authoritative planning prose</text>
<rect x="307.30" y="160.50" width="38.00" height="16" rx="8" fill="#e8f1fb" stroke="#4b78a8"/>
<text x="314.30" y="172.00" font-family="Arial,Helvetica,sans-serif" font-size="7.50" font-weight="bold" fill="#244b73">ACTIVE</text>
<text x="307.30" y="190.00" font-family="Arial,Helvetica,sans-serif" font-size="7.50" font-weight="normal" fill="#666">~3d</text>
<text x="307.30" y="199.38" font-family="Arial,Helvetica,sans-serif" font-size="7.50" font-weight="normal" fill="#666">forecast Oct</text>
<text x="307.30" y="218.25" font-family="Arial,Helvetica,sans-serif" font-size="8.00" font-weight="bold" fill="#4b5b6b">RESULT</text>
<circle cx="310.30" cy="226.35" r="1.6" fill="#4b78a8"/>
<text x="317.30" y="230.75" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">The consumer maps its planning model into</text>
<text x="317.30" y="241.38" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">compact RoadmapView data while keeping the</text>
<text x="317.30" y="252.00" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">original planning text complete and readable.</text>
<circle cx="310.30" cy="261.23" r="1.6" fill="#4b78a8"/>
<text x="317.30" y="265.62" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">Renderer layout adapts to wrapped content</text>
<text x="317.30" y="276.25" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">instead of imposing a fixed line-count</text>
<text x="317.30" y="286.88" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">contract on the consumer source.</text>
<text x="307.30" y="309.00" font-family="Arial,Helvetica,sans-serif" font-size="8.00" font-weight="bold" fill="#4b5b6b">DEMO</text>
<circle cx="310.30" cy="317.10" r="1.6" fill="#4b78a8"/>
<text x="317.30" y="321.50" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">Generate SVG and PDF from the compact view and</text>
<text x="317.30" y="332.12" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">inspect both outputs.</text>
<rect x="307.30" y="344.25" width="36.75" height="16" rx="5" fill="#fff4d6" stroke="#a77a19"/>
<text x="313.30" y="355.75" font-family="Arial,Helvetica,sans-serif" font-size="7.50" font-weight="bold" fill="#6a4b00">DESIGN</text>
<rect x="350.05" y="344.25" width="28.50" height="16" rx="5" fill="#eaf5e7" stroke="#5a8750"/>
<text x="356.05" y="355.75" font-family="Arial,Helvetica,sans-serif" font-size="7.50" font-weight="bold" fill="#31582b">TEST</text>
<rect x="560.59" y="87.50" width="251.30" height="139.88" rx="7" fill="#fff" stroke="#888888"/>
<text x="572.59" y="111.50" font-family="Arial,Helvetica,sans-serif" font-size="12.00" font-weight="bold" fill="#2f3337">Qualify release behavior</text>
<rect x="572.59" y="130.50" width="40.88" height="16" rx="8" fill="#f1f1f1" stroke="#888888"/>
<text x="579.59" y="142.00" font-family="Arial,Helvetica,sans-serif" font-size="7.50" font-weight="bold" fill="#555555">PLANNED</text>
<text x="572.59" y="165.50" font-family="Arial,Helvetica,sans-serif" font-size="8.00" font-weight="bold" fill="#4b5b6b">RESULT</text>
<circle cx="575.59" cy="173.60" r="1.6" fill="#4b78a8"/>
<text x="582.59" y="178.00" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">Owner and consumer verification are green.</text>
<text x="572.59" y="200.12" font-family="Arial,Helvetica,sans-serif" font-size="8.00" font-weight="bold" fill="#4b5b6b">DEMO</text>
<circle cx="575.59" cy="208.22" r="1.6" fill="#4b78a8"/>
<text x="582.59" y="212.62" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">Rebuild the published roadmap from a clean</text>
<text x="582.59" y="223.25" font-family="Arial,Helvetica,sans-serif" font-size="8.50" font-weight="normal" fill="#2f3337">checkout.</text>
<text x="763.89" y="581.28" font-family="Arial,Helvetica,sans-serif" font-size="7.50" font-weight="normal" fill="#777">Page 1/1</text></g>
</svg>
